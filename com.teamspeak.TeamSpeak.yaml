app-id: com.teamspeak.TeamSpeak
tags:
  - proprietary
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: teamspeak
finish-args:
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  - --share=network
  - --share=ipc
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.UPower
  - --talk-name=org.freedesktop.Accounts
  - --filesystem=xdg-download
  - --filesystem=xdg-config/TeamSpeak
  - --env=SSL_CERT_DIR=/etc/ssl/certs
modules:
  - name: teamspeak
    buildsystem: simple
    build-commands:
      - install -D apply_extra /app/bin/apply_extra
      - install -D teamspeak /app/bin/teamspeak
      - install -Dm644 -t /app/share/metainfo com.teamspeak.TeamSpeak.appdata.xml
      - install -Dm644 -t /app/share/applications com.teamspeak.TeamSpeak.desktop
      - install -Dm644 -t /app/share/icons/hicolor/128x128/apps com.teamspeak.TeamSpeak.png
    sources:
      - type: file
        path: com.teamspeak.TeamSpeak.desktop
      - type: file
        path: com.teamspeak.TeamSpeak.png
      - type: file
        path: com.teamspeak.TeamSpeak.appdata.xml
      - type: extra-data
        only-arches:
          - x86_64
        filename: teamspeak-client.tar.xz
        url: https://files.teamspeak-services.com/pre_releases/client/6.0.0-beta5.1/teamspeak-client.tar.xz
        sha256: f76ce48c74e3f4df8a2ab4d6d065d7bb41b5d7d2aec422cd5ddb113be8b0c193
        size: 158657876
        x-checker-data:
          type: html
          url: https://teamspeak.com/en/downloads/
          version-pattern: https://files.teamspeak-services.com/pre_releases/client/([\.\-beta\d]+)
          url-template: https://files.teamspeak-services.com/pre_releases/client/$version/teamspeak-client.tar.xz
      - type: script
        dest-filename: apply_extra
        commands:
          - tar xf teamspeak-client.tar.xz
          - rm -f teamspeak-client.tar.xz
      - type: script
        dest-filename: teamspeak
        commands:
          - |
            if [ -n "$WAYLAND_DISPLAY" ]; then
              echo "Using wayland"
              exec /app/extra/TeamSpeak --ozone-platform=wayland --enable-features=WaylandWindowDecorations
              --disable-vulkan "$@"
            else
              echo "Using X11"
              exec /app/extra/TeamSpeak --ozone-platform=x11 "$@"
            fi
